[project]
name = "llm-text-measurement"
version = "0.1.0"
description = "Measuring what hotel reviews talk about with an LLM, and checking the measurement: evidence-grounded labels, reviewer-provided ground truth, test-retest and cross-model agreement, negative controls, a distilled classifier and a word-embedding dictionary baseline."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["numpy", "pandas>=2.2", "scipy", "scikit-learn", "requests", "matplotlib"]

[project.optional-dependencies]
dictionary = ["gensim>=4.3"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
llmtm = "llmtm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmtm"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
